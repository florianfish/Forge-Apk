name: Build APK (réutilisable)

# Compile un APK de debug, le met en artefact, commente les PR avec le lien,
# et publie la pré-release « debug » (lien fixe) à chaque push sur la branche par défaut.
#
# Appel depuis un projet :
#   jobs:
#     build:
#       uses: florianfish/Forge-Apk/.github/workflows/android-build.yml@main
#       permissions:
#         contents: write        # pré-release « debug »
#         pull-requests: write   # commentaire sur les PR
#       with:
#         apk-name: MonAppli
#       secrets: inherit         # clé de debug fixe (secret DEBUG_KEYSTORE_BASE64)

on:
  workflow_call:
    inputs:
      apk-name:
        description: "Nom de l'appli : artefact <apk-name>-apk, fichier <apk-name>-debug.apk"
        type: string
        required: true
      gradle-version:
        description: "Version de Gradle à installer (ex. 9.9.1). Vide = wrapper du repo (./gradlew)"
        type: string
        default: ""
      gradle-tasks:
        description: "Tâches Gradle à lancer"
        type: string
        default: assembleDebug
      java-version:
        type: string
        default: "17"
      apk-path:
        description: "Chemin de l'APK produit"
        type: string
        default: app/build/outputs/apk/debug/app-debug.apk
      debug-release:
        description: "Publier l'APK dans la pré-release « debug » à chaque push sur la branche par défaut"
        type: boolean
        default: true
      stable-debug-key:
        description: "Signer avec la clé de debug fixe de Forge-Apk (chaque APK de debug s'installe par-dessus le précédent)"
        type: boolean
        default: true
    secrets:
      DEBUG_KEYSTORE_BASE64:
        description: "Clé de debug fixe, encodée en base64 (base64 -w0 debug.keystore)"
        required: false
      DEBUG_KEYSTORE_PASSWORD:
        description: "Mot de passe du keystore de debug (défaut : android)"
        required: false
      DEBUG_KEY_ALIAS:
        description: "Alias de la clé de debug (défaut : androiddebugkey)"
        required: false
      DEBUG_KEY_PASSWORD:
        description: "Mot de passe de la clé de debug (défaut : celui du keystore)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Deux pushes rapprochés sur main : le second attend, pour ne pas se marcher dessus sur la pré-release
    concurrency:
      group: forge-build-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Sans ça, le runner génère une clé de debug neuve à chaque build : Android refuse alors
      # d'installer l'APK par-dessus le précédent (désinstallation obligatoire = données perdues).
      # La clé vient du secret DEBUG_KEYSTORE_BASE64 du projet (« secrets: inherit » dans l'appel).
      - name: Clé de debug fixe
        id: debug-key
        if: inputs.stable-debug-key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FORGE_DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
          FORGE_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS || 'androiddebugkey' }}
          FORGE_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD || secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            # Les PR Dependabot (et de forks) n'ont pas accès aux secrets : build avec une clé jetable
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::Secret DEBUG_KEYSTORE_BASE64 indisponible pour cette PR : APK signé avec une clé de debug jetable"
              exit 0
            fi
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 manquant (dépôt › Settings › Secrets and variables › Actions ; « secrets: inherit » dans l'appel ; ou stable-debug-key: false)"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/forge-debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE" 2>/dev/null \
            || { echo "::error::DEBUG_KEYSTORE_BASE64 n'est pas du base64 valide (coller tout le fichier encodé, sur une ligne)"; exit 1; }
          # Empreinte attendue de l'APK, lue dans la clé elle-même
          SHA256=$(keytool -list -v -keystore "$KEYSTORE" -storepass:env FORGE_DEBUG_STORE_PASSWORD -alias "$FORGE_DEBUG_KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$SHA256" ] \
            || { echo "::error::Clé de debug illisible : DEBUG_KEYSTORE_PASSWORD ou DEBUG_KEY_ALIAS incorrect, ou DEBUG_KEYSTORE_BASE64 incomplet"; exit 1; }
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          # Copier la clé dans ~/.android ne suffit pas : sur les runners, le plugin Android l'ignore
          # et génère une clé neuve à chaque build. Ce script Gradle l'impose à signingConfigs.debug.
          cat > "$RUNNER_TEMP/forge-debug-signing.init.gradle" <<'GRADLE'
          allprojects { project ->
              project.plugins.withId('com.android.application') {
                  def debug = project.extensions.getByName('android').signingConfigs.getByName('debug')
                  debug.storeFile = new File(System.getenv('FORGE_DEBUG_KEYSTORE'))
                  debug.storePassword = System.getenv('FORGE_DEBUG_STORE_PASSWORD')
                  debug.keyAlias = System.getenv('FORGE_DEBUG_KEY_ALIAS')
                  debug.keyPassword = System.getenv('FORGE_DEBUG_KEY_PASSWORD')
              }
          }
          GRADLE
          {
            echo "FORGE_DEBUG_KEYSTORE=$KEYSTORE"
            echo "FORGE_DEBUG_STORE_PASSWORD=$FORGE_DEBUG_STORE_PASSWORD"
            echo "FORGE_DEBUG_KEY_ALIAS=$FORGE_DEBUG_KEY_ALIAS"
            echo "FORGE_DEBUG_KEY_PASSWORD=$FORGE_DEBUG_KEY_PASSWORD"
            echo "FORGE_INIT_SCRIPT=-I $RUNNER_TEMP/forge-debug-signing.init.gradle"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ inputs.gradle-version }}

      # Version du build de debug : celle de la dernière release (tag v*), le projet ajoute « -debug.<run> ».
      # versionCode = numéro du run : chaque APK de debug s'installe par-dessus le précédent.
      - name: Version
        id: version
        run: |
          LAST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -1)
          if [ -n "$LAST" ]; then
            echo "VERSION_NAME=$LAST" >> "$GITHUB_ENV"
            echo "Dernière release : v$LAST"
          else
            echo "Aucune release : version par défaut du projet"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Compilation
        env:
          GRADLE_VERSION: ${{ inputs.gradle-version }}
          TASKS: ${{ inputs.gradle-tasks }}
        run: |
          if [ -n "$GRADLE_VERSION" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          # FORGE_INIT_SCRIPT : signature avec la clé de debug fixe (étape précédente)
          $GRADLE $FORGE_INIT_SCRIPT $TASKS --no-daemon

      # Garde-fou : si l'APK n'est pas signé avec la clé fixe, il ne s'installera pas par-dessus le précédent
      - name: Vérification de la signature
        if: steps.debug-key.outputs.sha256 != ''
        env:
          APK_PATH: ${{ inputs.apk-path }}
          EXPECTED: ${{ steps.debug-key.outputs.sha256 }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee certs.txt
          grep -qi "SHA-256 digest: $EXPECTED" certs.txt \
            || { echo "::error::APK de debug non signé avec la clé fixe (secret DEBUG_KEYSTORE_BASE64)"; exit 1; }

      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        id: apk
        with:
          name: ${{ inputs.apk-name }}-apk
          path: ${{ inputs.apk-path }}

      # Sur une PR : commentaire avec le lien de l'APK de debug, mis à jour à chaque push
      - name: Lien de l'APK dans la PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.apk.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NAME: ${{ inputs.apk-name }}
        run: |
          body="📦 **APK de debug** (commit ${SHA:0:7}) : [télécharger $NAME-apk]($URL)

          Fichier zip à décompresser ; lien valable 90 jours, connexion GitHub requise."
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body" \
            || gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"

      # Push sur la branche par défaut : pré-release « debug » remplacée à chaque build,
      # lien fixe vers l'APK : https://github.com/<owner>/<repo>/releases/download/debug/<apk-name>-debug.apk
      - name: Pré-release « debug »
        if: >-
          inputs.debug-release &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ inputs.apk-path }}
          NAME: ${{ inputs.apk-name }}
        run: |
          APK="$NAME-debug.apk"
          cp "$APK_PATH" "$APK"
          notes="APK de debug du dernier build de \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA:0:7}, run #${GITHUB_RUN_NUMBER}).

          Remplacée à chaque push. S'installe à côté de la version release si l'appli utilise un suffixe d'applicationId en debug."
          # On repart de zéro pour que le tag « debug » pointe sur le commit compilé
          gh release delete debug -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create debug "$APK" -R "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Debug — dernier build" --notes "$notes"
          echo "📦 https://github.com/$GITHUB_REPOSITORY/releases/download/debug/$APK" >> "$GITHUB_STEP_SUMMARY"
