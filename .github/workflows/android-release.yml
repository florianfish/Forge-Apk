name: Release APK (réutilisable)

# Compile un APK de release signé et le publie dans une release GitHub.
#
# Appel depuis un projet (voir README pour les déclencheurs) :
#   jobs:
#     release:
#       uses: florianfish/Forge-Apk/.github/workflows/android-release.yml@main
#       permissions:
#         contents: write
#       with:
#         apk-name: MonAppli
#         type: ${{ inputs.type }}
#       secrets: inherit
#
# Le projet doit lire dans app/build.gradle.kts les variables d'environnement
# KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, VERSION_CODE et VERSION_NAME.

on:
  workflow_call:
    inputs:
      apk-name:
        description: "Préfixe du fichier publié : <apk-name>-vX.Y.Z.apk"
        type: string
        required: true
      type:
        description: "Lancement manuel : mineure, correctif ou majeure (ignoré sur un push de tag)"
        type: string
        default: mineure
      gradle-version:
        description: "Version de Gradle à installer. Vide = wrapper du repo (./gradlew)"
        type: string
        default: ""
      java-version:
        type: string
        default: "17"
      apk-path:
        type: string
        default: app/build/outputs/apk/release/app-release.apk
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: forge-release-${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        env:
          TYPE: ${{ inputs.type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Lancer le workflow depuis la branche $DEFAULT_BRANCH"; exit 1; }
            LAST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -1)
            IFS=. read -r MAJ MIN PAT <<< "${LAST:-0.0.0}"
            MAJ=${MAJ:-0} MIN=${MIN:-0} PAT=${PAT:-0}
            case "${TYPE:-mineure}" in
              majeure)   TAG="v$((MAJ + 1)).0.0" ;;
              correctif) TAG="v$MAJ.$MIN.$((PAT + 1))" ;;
              *)         TAG="v$MAJ.$((MIN + 1)).0" ;;
            esac
            echo "Dernière version : v${LAST:-aucune} → nouvelle : $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ inputs.gradle-version }}

      # Diagnostic clair des secrets de signature, avant les quelques minutes de compilation
      # (sinon Gradle échoue tard avec « Failed to read key *** from store … : null »)
      - name: Vérification de la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || fail "Secret $s manquant (dépôt › Settings › Secrets and variables › Actions ; « secrets: inherit » dans l'appel)"
          done
          for s in KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            v="${!s}"
            [ "$v" = "$(printf '%s' "$v" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ] \
              || fail "Le secret $s commence ou finit par un espace ou un retour à la ligne : le recréer sans"
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null \
            || fail "KEYSTORE_BASE64 n'est pas du base64 valide (coller tout le fichier encodé, sur une ligne)"
          LIST=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD 2>&1) \
            || fail "Keystore illisible : KEYSTORE_PASSWORD incorrect, ou KEYSTORE_BASE64 incomplet"
          echo "$LIST" | grep -qi "^${KEY_ALIAS}," \
            || fail "Alias KEY_ALIAS introuvable dans la clé. Alias présents : $(echo "$LIST" | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')"
          # Lecture de la clé comme le fait Gradle (keytool ne vérifie pas KEY_PASSWORD sur une clé PKCS12)
          cat > "$RUNNER_TEMP/LireCle.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;
          public class LireCle {
              public static void main(String[] args) throws Exception {
                  KeyStore ks = KeyStore.getInstance(new File(args[0]), System.getenv("KEYSTORE_PASSWORD").toCharArray());
                  try {
                      if (ks.getKey(System.getenv("KEY_ALIAS"), System.getenv("KEY_PASSWORD").toCharArray()) == null) System.exit(2);
                  } catch (java.security.UnrecoverableKeyException e) {
                      System.exit(3);
                  }
              }
          }
          JAVA
          java "$RUNNER_TEMP/LireCle.java" "$KEYSTORE_FILE" > /dev/null 2>&1 || case $? in
            2) fail "Alias KEY_ALIAS introuvable (la casse compte pour la signature) : utiliser exactement $(echo "$LIST" | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')" ;;
            3) fail "KEY_PASSWORD incorrect (avec une clé PKCS12, c'est en général le même que KEYSTORE_PASSWORD)" ;;
            *) fail "Clé illisible avec ces secrets" ;;
          esac
          echo "Clé de signature OK"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          TAG: ${{ steps.version.outputs.tag }}
          GRADLE_VERSION: ${{ inputs.gradle-version }}
          APK_PATH: ${{ inputs.apk-path }}
          NAME: ${{ inputs.apk-name }}
        run: |
          # Clé déjà décodée et vérifiée à l'étape précédente
          if [ -n "$GRADLE_VERSION" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          VERSION_NAME="${TAG#v}" $GRADLE assembleRelease --no-daemon
          cp "$APK_PATH" "$NAME-$TAG.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ inputs.apk-name }}
        run: |
          APK="$NAME-$TAG.apk"
          # Release déjà créée à la main dans l'interface GitHub : on y ajoute (ou remplace) l'APK
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --clobber
          else
            # Lancement par le bouton : la release crée aussi le tag, sur le commit compilé.
            # (Un tag créé avec le jeton du workflow ne relance pas de workflow : pas de double build.)
            gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
